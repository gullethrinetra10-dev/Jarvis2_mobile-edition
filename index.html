<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S AI Assistant</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  min-height: 100vh;
  background: radial-gradient(circle, #082333, #020609 75%);
  color: #00eaff;
  font-family: monospace;
  text-align: center;
}

h1 {
  font-size: 30px;
  letter-spacing: 6px;
  text-shadow: 0 0 15px #00eaff;
  margin-top: 20px;
}

.subtitle {
  color: #8adce8;
  letter-spacing: 3px;
  font-size: 11px;
}

#status {
  margin: 20px auto;
  color: #00ff88;
  font-weight: bold;
}

#status.error {
  color: #ff5555;
}

.arc {
  width: 155px;
  height: 155px;
  margin: 25px auto;
  border: 4px solid #00eaff;
  border-radius: 50%;
  display: flex;
  justify-content: center;
  align-items: center;
  box-shadow: 0 0 20px #00eaff,
              inset 0 0 20px #00eaff;
  animation: pulse 2s infinite;
}

.arc span {
  font-size: 55px;
  font-weight: bold;
  text-shadow: 0 0 20px #00eaff;
}

@keyframes pulse {
  50% {
    box-shadow: 0 0 45px #00eaff,
                inset 0 0 30px #00eaff;
  }
}

textarea {
  width: 100%;
  min-height: 100px;
  background: #00131d;
  color: #00eaff;
  border: 1px solid #00eaff;
  border-radius: 10px;
  padding: 14px;
  font-size: 15px;
  outline: none;
  resize: vertical;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 12px;
  background: #00d9ef;
  color: #001018;
  border: none;
  border-radius: 8px;
  font-weight: bold;
  font-size: 15px;
  cursor: pointer;
}

button:disabled {
  opacity: 0.5;
}

.mic {
  background: #005c83;
  color: white;
}

.stop {
  background: #8b2020;
  color: white;
}

#reply {
  border: 1px solid #00eaff;
  background: rgba(0, 20, 30, 0.8);
  border-radius: 10px;
  padding: 15px;
  margin-top: 20px;
  min-height: 120px;
  color: white;
  text-align: left;
  white-space: pre-wrap;
  line-height: 1.6;
  overflow-wrap: anywhere;
}

.footer {
  margin-top: 25px;
  color: #4c8d9b;
  font-size: 11px;
}
</style>
</head>

<body>

<h1>J.A.R.V.I.S</h1>
<div class="subtitle">JUST A RATHER VERY INTELLIGENT SYSTEM</div>

<div id="status">● BRAIN ONLINE</div>

<div class="arc">
  <span>J</span>
</div>

<textarea id="prompt"
placeholder="Type your command here..."></textarea>

<button id="sendBtn" onclick="ask()">
  SEND COMMAND
</button>

<button class="mic" id="micBtn" onclick="startListening()">
  🎤 ACTIVATE VOICE
</button>

<button class="stop" onclick="stopAll()">
  🔇 STOP VOICE
</button>

<div id="reply">
JARVIS SYSTEM READY.
Awaiting your command...
</div>

<div class="footer">
J.A.R.V.I.S AI SYSTEM | GEMINI POWERED
</div>

<script>
// @ts-nocheck

// ==================================
// GEMINI API SETTINGS
// ==================================

const API_KEY = "ENTER_YOUR_GEMINI_API_KEY"
const MODEL = "gemini-3.1-flash-lite";

const API_URL =
"https://generativelanguage.googleapis.com/v1beta/models/"
+ MODEL + ":generateContent";

// ==================================
// SYSTEM VARIABLES
// ==================================

let recognition = null;
let isListening = false;
let isBusy = false;

let conversationHistory = [];

const statusBox = document.getElementById("status");
const replyBox = document.getElementById("reply");
const promptBox = document.getElementById("prompt");
const sendBtn = document.getElementById("sendBtn");
const micBtn = document.getElementById("micBtn");

// ==================================
// STATUS FUNCTION
// ==================================

function setStatus(message, error = false) {
  statusBox.innerText = message;
  statusBox.className = error ? "error" : "";
}

// ==================================
// GEMINI BRAIN
// ==================================

async function ask() {

  const userMessage = promptBox.value.trim();

  if (!userMessage) {
    replyBox.innerText = "Please enter a command.";
    return;
  }

  if (isBusy) return;

  if (!API_KEY ||
      API_KEY === "PASTE_YOUR_GEMINI_API_KEY_HERE") {
    replyBox.innerText =
      "ERROR: Please add your Gemini API key in the code.";
    setStatus("API KEY MISSING", true);
    return;
  }

  isBusy = true;
  sendBtn.disabled = true;

  setStatus("● CONNECTING TO GEMINI BRAIN...");
  replyBox.innerText = "JARVIS IS THINKING...";

  try {

    const contents = [
      ...conversationHistory,
      {
        role: "user",
        parts: [{ text: userMessage }]
      }
    ];

    const response = await fetch(API_URL, {
      method: "POST",

      headers: {
        "Content-Type": "application/json",
        "x-goog-api-key": API_KEY
      },

      body: JSON.stringify({

        systemInstruction: {
          parts: [{
            text:
              "You are JARVIS, an intelligent and friendly AI assistant. " +
              "Your name is JARVIS. Answer naturally, clearly and helpfully. " +
              "Reply in the same language used by the user. " +
              "If the user speaks Telugu, reply in Telugu."
          }]
        },

        contents: contents,

        generationConfig: {
          temperature: 0.7,
          maxOutputTokens: 2048
        }

      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(
        data.error?.message || "Gemini API request failed"
      );
    }

    const answer = data.candidates?.[0]?.content?.parts
      ?.map(p => p.text || "")
      .join("")
      .trim();

    if (!answer) {
      throw new Error("Gemini returned an empty response.");
    }

    // Save conversation
    conversationHistory.push(
      { role: "user", parts: [{ text: userMessage }] },
      { role: "model", parts: [{ text: answer }] }
    );

    // Keep last 10 messages
    if (conversationHistory.length > 10) {
      conversationHistory =
        conversationHistory.slice(-10);
    }

    replyBox.innerText = answer;

    setStatus("✓ JARVIS BRAIN ONLINE");

    speak(answer);

  } catch (error) {

    replyBox.innerText =
      "JARVIS ERROR:\n" + error.message;

    setStatus("CONNECTION FAILED", true);

  } finally {

    isBusy = false;
    sendBtn.disabled = false;

  }
}

// ==================================
// VOICE INPUT
// ==================================

function startListening() {

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SpeechRecognition) {

    alert(
      "Voice recognition not supported. Please try Chrome browser."
    );

    return;
  }

  if (isListening) {
    return;
  }

  recognition = new SpeechRecognition();

  recognition.lang = "te-IN";
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  recognition.onstart = function() {

    isListening = true;

    micBtn.innerText = "🎤 LISTENING...";

    setStatus("● JARVIS IS LISTENING...");

  };

  recognition.onresult = function(event) {

    const spokenText =
      event.results[0][0].transcript;

    promptBox.value = spokenText;

    setStatus("VOICE RECEIVED");

    ask();

  };

  recognition.onerror = function(event) {

    setStatus(
      "VOICE ERROR: " + event.error,
      true
    );

  };

  recognition.onend = function() {

    isListening = false;

    micBtn.innerText = "🎤 ACTIVATE VOICE";

  };

  try {

    recognition.start();

  } catch (error) {

    setStatus("MICROPHONE ERROR", true);

  }
}

// ==================================
// VOICE OUTPUT
// ==================================

function speak(text) {

  if (!("speechSynthesis" in window)) {
    return;
  }

  window.speechSynthesis.cancel();

  const speech =
    new SpeechSynthesisUtterance(text);

  speech.lang = "te-IN";
  speech.rate = 0.9;
  speech.pitch = 1;
  speech.volume = 1;

  speech.onstart = function() {
    setStatus("🔊 JARVIS IS SPEAKING...");
  };

  speech.onend = function() {
    setStatus("✓ JARVIS BRAIN ONLINE");
  };

  speech.onerror = function() {
    setStatus("BRAIN ONLINE - VOICE UNAVAILABLE");
  };

  window.speechSynthesis.speak(speech);
}

// ==================================
// STOP VOICE
// ==================================

function stopAll() {

  if (recognition && isListening) {

    recognition.stop();

  }

  isListening = false;

  if ("speechSynthesis" in window) {

    window.speechSynthesis.cancel();

  }

  micBtn.innerText = "🎤 ACTIVATE VOICE";

  setStatus("✓ JARVIS READY");

}

// ==================================
// ENTER KEY SUPPORT
// ==================================

promptBox.addEventListener("keydown", function(event) {

  if (event.key === "Enter" && !event.shiftKey) {

    event.preventDefault();

    ask();

  }

});

</script>

</body>
</html>
